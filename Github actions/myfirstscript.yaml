name: This program is my new program
  push: on
    branches:
    -main
jobs:
  docker:
    run: ubuntu-latest
    steps:
    - name: Docker build
      run: echo docker build -t ${{env.CONTAINER_REGISTRY}}//${{vars.CONTAINER_REGISTRY}}/$IMAGE_NAME:latest

    -name: Docker login
    run: echo docker login --username=${{env.username}} --password= ${{secrets.DOCKER_PASSWORD}}
    
    -name: Docker publish
    run: echo docker push ${{env.CONTAINER_REGISTRY}}/${{vars.DOCKER_USERNAME}}/$IMAGE_NAME:latest

  deploy:
    needs: docker
    run: ubuntu-latest
    steps:
    - name: Docker run
      run: echo docker run -d -p 8080:80 $CONTAINER_REGISTRY/${{vars.DOCKER_USERNAME}}/$IMAGE_NAME:latest
      

